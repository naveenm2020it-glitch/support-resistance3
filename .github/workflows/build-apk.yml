name: Build Android APK and Run Unit Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply one-time NIFTY seller-intelligence patch bundle
        if: hashFiles('nifty-seller-intelligence-support-resistance3-patch.zip.b64') != ''
        run: |
          base64 --decode nifty-seller-intelligence-support-resistance3-patch.zip.b64 > "$RUNNER_TEMP/nifty-seller-intelligence-patch.zip"
          printf '%s  %s\n' '1e272b11d9bf5e1c0148b23d41350ad38589a887f6b7edf869f97b4f476f103d' "$RUNNER_TEMP/nifty-seller-intelligence-patch.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/nifty-seller-intelligence-patch.zip"
          unzip -o "$RUNNER_TEMP/nifty-seller-intelligence-patch.zip" -d .
          rm nifty-seller-intelligence-support-resistance3-patch.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/src/main/java/com/nifty/sellerfootprint/data/ExpiryResolver.kt app/src/main/java/com/nifty/sellerfootprint/engine/AnalysisOrchestrator.kt app/src/main/java/com/nifty/sellerfootprint/engine/MultiStrikeAnalyzer.kt app/src/main/java/com/nifty/sellerfootprint/engine/PatternDiscoveryEngine.kt app/src/main/java/com/nifty/sellerfootprint/engine/ZoneDerivationEngine.kt app/src/main/java/com/nifty/sellerfootprint/model/DomainModels.kt app/src/test/java/com/nifty/sellerfootprint/RegressionFixesVerificationTest.kt app/src/test/java/com/nifty/sellerfootprint/TwentyTwoSessionAnalyticalEngineTest.kt
          git add -A -- nifty-seller-intelligence-support-resistance3-patch.zip.b64
          git commit -m "Apply NIFTY seller intelligence A-F2 updates [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests and assemble Debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NiftySellerFootprint-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: NIFTY Seller Footprint APK build ${{ github.run_number }}
          body: |
            APK generated after successful unit tests and Android debug build.
            Download the APK asset directly below; no artifact ZIP extraction required.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
